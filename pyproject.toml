[project]
name = "career-radar"
version = "0.1.0"
description = "Türkiye teknoloji şirketi keşif ve iletişim motoru"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "rapidfuzz>=3.9",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]
# `enrich --backend api` için: isimli kişi (CEO/İK) çıkarımını LLM_API_KEY
# ile canlı çalıştırır. Anahtar yoksa kurulmasına gerek yok, --backend export
# hiçbir ek bağımlılık gerektirmeden çalışır.
llm = ["anthropic>=0.40"]

[project.scripts]
career-radar = "career_radar.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
